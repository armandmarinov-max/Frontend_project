<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toernooien</title>
    <link rel="stylesheet" href="theme.css" />  <!-- voor je styles.css -->
     <script src="theme.js">
      (function() {
    if (localStorage.getItem('royal-gambit-theme') === 'day')
      document.body.classList.add('day');
  })();
     </script>
</head>
<body>
    
    <section aria-labelledby="Get-Toernooien-title">
      <h2 id="Get-Toernooien-title">GET alle Toernooien</h2>
      <div class="Get-Toernooien">
        <button id="load-toernooien">Laad Toernooien</button>
        <input id="search-id" type="number" placeholder="Zoek op toernooi ID..." />
        <button id="search-toernooi-id">Zoek</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
  
    <section aria-labelledby="Post-Toernooi-title">
      <h2 id="Post-Toernooi-title">Voeg een Toernooi toe</h2>
      <div class="Post-Toernooi">
        <button id="add-toernooi">voeg toe</button>
        <input id="toernooi_id" type="number" placeholder="Geef een Toernooi ID" />
        <input id="naam" type="text" placeholder="Geef een Naam" />
        <input id="locatie" type="text" placeholder="Geef een Locatie" />
        <input id="start_datum" type="date" placeholder="Geef een Start Datum" />
        <input id="eind_datum" type="date" placeholder="Geef een Eind Datum" />
        <input id="timecontrol" type="text" placeholder="Geef een Timecontrol" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
   
    <section aria-labelledby="Delete-Toernooi-title">
      <h2 id="Delete-Toernooi-title">Verwijder een Toernooi</h2>
      <div class="Delete-Toernooi">
        <button id="delete-toernooi">verwijder toernooi</button>
        <input id="delete-toernooi_id" type="number" placeholder="Geef een Toernooi ID" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
   
     <section aria-labelledby="Put-Toernooi-title">
      <h2 id="Put-Toernooi-title">Update een Toernooi</h2>
      <div class="Put-Toernooi">
        <button id="update-toernooi">update toernooi</button>
        <input id="update-toernooi_id" type="number" placeholder="Geef een Toernooi ID" />
        <input id="update-naam" type="text" placeholder="Geef een Naam" />
        <input id="update-locatie" type="text" placeholder="Geef een Locatie" />
        <input id="update-start_datum" type="date" placeholder="Geef een Start Datum" />
        <input id="update-eind_datum" type="date" placeholder="Geef een Eind Datum" />
        <input id="update-timecontrol" type="text" placeholder="Geef een Timecontrol" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </main>
</body>
      <script>
      window.alleToernooien = [];
      document.addEventListener("DOMContentLoaded", function() {
        function toonToernooiKaart(t, results) {
          const div = document.createElement("div");
          div.className = "Get-Toernooien";
          const sd = t.startDatum ? new Date(t.startDatum).toLocaleDateString("nl-BE") : "—";
          const ed = t.eindDatum  ? new Date(t.eindDatum).toLocaleDateString("nl-BE")  : "—";
          div.innerHTML = "<h3>" + (t.toernooiId ?? "—") + "</h3>"
            + "<p>Naam: " + (t.naam ?? "—") + "</p>"
            + "<p>Locatie: " + (t.locatie ?? "—") + "</p>"
            + "<p>StartDatum: " + sd + "</p>"
            + "<p>EindDatum: " + ed + "</p>"
            + "<p>TimeControle: " + (t.timeControle ?? "—") + "</p>";
          results.appendChild(div);
        }
        function zoekOpId() {
          const id = document.getElementById("search-id").value.trim();
          if (!id) { alert("Geef een toernooi ID op."); return; }
          const status = document.getElementById("status");
          const results = document.getElementById("results");
          if (window.alleToernooien.length > 0) {
            const gevonden = window.alleToernooien.filter(t => String(t.toernooiId) === id);
            if (gevonden.length > 0) {
              status.textContent = ""; results.innerHTML = "";
              gevonden.forEach(t => toonToernooiKaart(t, results)); return;
            }
          }
          status.textContent = "Laden…";
          fetch("http://localhost:5080/api/Schaak/" + id)
            .then(r => { if (!r.ok) throw new Error("Toernooi niet gevonden"); return r.json(); })
            .then(data => {
              status.textContent = ""; results.innerHTML = "";
              const lijst = Array.isArray(data) ? data : [data];
              lijst.forEach(t => toonToernooiKaart(t, results));
            })
            .catch(err => { status.textContent = err.message; });
        }
        document.getElementById("search-toernooi-id").addEventListener("click", zoekOpId);
        document.getElementById("search-id").addEventListener("keydown", function(e) { if (e.key === "Enter") zoekOpId(); });
      });
    </script>
      <script src="toernooien.js"></script>
      <link rel="stylesheet" href="styles.css" />
    </main>
</body>
</html>

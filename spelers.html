<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelers</title>
    <link rel="stylesheet" href="theme.css" />  <!-- voor je styles.css -->
<script src="theme.js">
  (function() {
    if (localStorage.getItem('royal-gambit-theme') === 'day')
      document.body.classList.add('day');
  })();
</script>
</head>
<body>
   
    <section aria-labelledby="Get-Spelers-title">
      <h2 id="Get-Spelers-title">GET alle Spelers</h2>
      <div class="Get-Spelers">
        <button id="load-spelers">Laad Spelers</button>
        <input id="search-id" type="number" placeholder="Zoek op speler ID..." />
        <button id="search-speler-id">Zoek</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>

    <section aria-labelledby="Post-Spelers-title">
      <h2 id="Post-Spelers-title">Voeg een Speler toe</h2>
      <div class="Post-Spelers">
        <button id="add-speler">voeg toe</button>
        <input id="voornaam" type="text" placeholder="Geef een Voornaam" />
        <input id="achternaam" type="text" placeholder="Geef een Achternaam" />
        <input id="fide_id" type="number" placeholder="Geef een Fide ID" />
        <input id="land" type="text" placeholder="Geef een Land" />
        <input id="geslacht" type="text" placeholder="Geef een Geslacht" />
        <input id="geboortejaar" type="number" placeholder="Geef een Geboortejaar" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>

    <section aria-labelledby="Delete-Spelers-title">
      <h2 id="Delete-Spelers-title">Verwijder een Speler</h2>
      <div class="Delete-Spelers">
        <button id="delete-speler">verwijder</button>
        <input id="Id_van_speler" type="text" placeholder="Geef het ID van de speler" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
   
   
    <section aria-labelledby="Put-Spelers-title">
      <h2 id="Put-Spelers-title">Update een Speler</h2>
      <div class="Put-Spelers">
        <button id="update-speler">update</button>
        <input id="update-speler_id" type="number" placeholder="Geef het ID van de speler" />
        <input id="update-voornaam" type="text" placeholder="Geef een Voornaam" />
        <input id="update-achternaam" type="text" placeholder="Geef een Achternaam" />
        <input id="update-fide_id" type="number" placeholder="Geef een Fide ID" />
        <input id="update-land" type="text" placeholder="Geef een Land" />
        <input id="update-geslacht" type="text" placeholder="Geef een Geslacht" />
        <input id="update-geboortejaar" type="number" placeholder="Geef een Geboortejaar" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
    <script>
      // Globale lijst van geladen spelers (wordt gevuld door spelers.js via window.alleSpelers)
      window.alleSpelers = [];

      document.addEventListener('DOMContentLoaded', function() {

        function toonSpelerKaart(s, results) {
          const div = document.createElement('div');
          div.className = 'Get-Spelers';
          div.innerHTML = `
            <h3>${s.spelerId ?? s.speler_id ?? '—'}</h3>
            <p>Voornaam: ${s.voornaam ?? '—'}</p>
            <p>Achternaam: ${s.achternaam ?? '—'}</p>
            <p>FIDE ID: ${s.fideId ?? s.fide_id ?? '—'}</p>
            <p>Land: ${s.land ?? '—'}</p>
            <p>Geslacht: ${s.geslacht ?? '—'}</p>
            <p>Geboortejaar: ${s.geboortejaar ?? '—'}</p>
          `;
          results.appendChild(div);
        }

        function zoekOpId() {
          const spelerId = document.getElementById('search-id').value.trim();
          if (!spelerId) { alert('Geef een speler ID op.'); return; }

          const status  = document.getElementById('status');
          const results = document.getElementById('results');

          // Eerst proberen uit de al geladen lijst te filteren
          if (window.alleSpelers.length > 0) {
            const gevonden = window.alleSpelers.filter(s =>
              String(s.spelerId ?? s.speler_id ?? '') === spelerId
            );
            if (gevonden.length > 0) {
              status.textContent = '';
              results.innerHTML = '';
              gevonden.forEach(s => toonSpelerKaart(s, results));
              return;
            }
          }

          // Fallback: directe API-call
          status.textContent = 'Laden…';
          fetch(`http://localhost:5080/api/Speler/${spelerId}`)
            .then(response => {
              if (!response.ok) throw new Error('Speler niet gevonden');
              return response.json();
            })
            .then(data => {
              status.textContent = '';
              results.innerHTML = '';
              // API kan array of enkel object teruggeven
              const lijst = Array.isArray(data) ? data : [data];
              lijst.forEach(s => toonSpelerKaart(s, results));
            })
            .catch(err => {
              status.textContent = err.message;
            });
        }

        document.getElementById('search-speler-id').addEventListener('click', zoekOpId);

        document.getElementById('search-id').addEventListener('keydown', function(e) {
          if (e.key === 'Enter') zoekOpId();
        });
      });
    </script>
    <script src="spelers.js"></script>
    <link rel="stylesheet" href="styles.css" />

  </main>
</body>
</html>

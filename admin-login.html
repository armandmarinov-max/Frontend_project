<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Royal Gambit</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Lora:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0b09;
      --bg2:      #141210;
      --bg3:      #1c1a16;
      --bg4:      #242118;
      --gold:     #c9a84c;
      --gold2:    #e8c97a;
      --gold-dim: #6b5420;
      --cream:    #ede5d0;
      --muted:    #7a7160;
      --border:   rgba(201,168,76,0.15);
      --border2:  rgba(201,168,76,0.30);
      --white-sq: #c8b48a;
      --black-sq: #1e1a12;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .board-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 1fr);
      opacity: 0.03;
    }
    .board-bg span { display: block; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12,11,9,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 56px;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--gold);
      display: flex; align-items: center; gap: 0.5rem;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }

    .login-wrap {
      position: relative; z-index: 1;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2.5rem 2.25rem 2rem;
      animation: fadeUp 0.6s ease both;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
    }

    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-piece {
      font-size: 2.4rem; line-height: 1; margin-bottom: 0.75rem;
      opacity: 0.7; animation: floatPiece 6s ease-in-out infinite; display: block;
    }
    @keyframes floatPiece {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-6px) rotate(3deg); }
    }
    .login-eyebrow {
      font-family: 'DM Mono', monospace; font-size: 0.62rem;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem;
    }
    .login-title {
      font-family: 'Playfair Display', serif; font-size: 1.65rem; font-weight: 700; color: var(--cream);
    }
    .login-title em { font-style: italic; color: var(--gold); }

    .login-divider {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem;
    }
    .login-divider-line { flex: 1; height: 1px; background: var(--border); }
    .login-divider-label {
      font-family: 'DM Mono', monospace; font-size: 0.58rem;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    }

    .field { margin-bottom: 1.25rem; }
    .field label {
      display: block; font-family: 'DM Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 2px; padding: 0.75rem 1rem; font-family: 'DM Mono', monospace;
      font-size: 0.85rem; color: var(--cream); outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .field input::placeholder { color: var(--muted); opacity: 0.6; }
    .field input:focus { border-color: var(--gold-dim); background: var(--bg4); }

    .login-btn {
      width: 100%; margin-top: 0.5rem; padding: 0.85rem 1rem;
      background: transparent; border: 1px solid var(--gold-dim); border-radius: 2px;
      font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--gold); cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .login-btn:hover:not(:disabled) { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      display: none; font-family: 'DM Mono', monospace; font-size: 0.65rem;
      letter-spacing: 0.1em; color: #c97a7a;
      background: rgba(201,122,122,0.08); border: 1px solid rgba(201,122,122,0.2);
      border-radius: 2px; padding: 0.6rem 0.9rem; margin-top: 1rem; text-align: center;
    }
    .error-msg.visible { display: block; }

    .back-link {
      display: block; text-align: center; margin-top: 1.5rem;
      font-family: 'DM Mono', monospace; font-size: 0.63rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: var(--gold); }

    footer {
      position: relative; z-index: 1; border-top: 1px solid var(--border);
      padding: 1.25rem 2rem; display: flex; align-items: center; justify-content: space-between;
      font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="board-bg" aria-hidden="true" id="board"></div>

  <nav>
    <a href="home.html" class="nav-logo">♔ <span>Royal Gambit</span></a>
    <div class="nav-links">
      <a href="home.html#tournaments">Tournaments</a>
      <a href="home.html#rankings">Rankings</a>
      <a href="home.html#upcoming">Schedule</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">

      <div class="login-header">
        <span class="login-piece" aria-hidden="true">♚</span>
        <p class="login-eyebrow">Restricted access</p>
        <h1 class="login-title">Admin <em>panel</em></h1>
      </div>

      <div class="login-divider">
        <div class="login-divider-line"></div>
        <span class="login-divider-label">Credentials required</span>
        <div class="login-divider-line"></div>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="enter your password" autocomplete="current-password" />
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">
        &#9823; &nbsp; Log in as admin
      </button>

      <div class="error-msg" id="errorMsg"></div>

      <a href="home.html" class="back-link">← Back to home</a>

    </div>
  </div>

  <footer>
    <span>Royal Gambit &copy; 2026</span>
    <span>Admin portal</span>
  </footer>

  <script>
    // Build checkerboard bg
    const board = document.getElementById('board');
    for (let r = 0; r < 12; r++) {
      for (let c = 0; c < 12; c++) {
        const sq = document.createElement('span');
        sq.style.background = (r + c) % 2 === 0 ? '#c8b48a' : '#1e1a12';
        board.appendChild(sq);
      }
    }
  </script>

  <!-- Login logic lives in its own file -->
  <script src="login.js"></script>

</body>
</html>

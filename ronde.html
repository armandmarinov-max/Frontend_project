<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rondes</title>
    <link rel="stylesheet" href="theme.css" />  <!-- voor je styles.css -->
<script src="theme.js">
  (function() {
    if (localStorage.getItem('royal-gambit-theme') === 'day')
      document.body.classList.add('day');
  })();
</script>
</head>
<body>

    <section aria-labelledby="Get-Rondes-title">
      <h2 id="Get-Rondes-title">GET alle Rondes</h2>
      <div class="Get-Rondes">
        <button id="load-rondes">Laad Rondes</button>
        <input id="search-id" type="number" placeholder="Zoek op ronde ID..." />
        <button id="search-ronde-id">Zoek</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>

  <section aria-labelledby="Post-Rondes-title">
      <h2 id="Post-Rondes-title">Voeg een Rondes toe</h2>
      <div class="Post-Rondes">
        <button id="add-ronde">voeg toe</button>
        <input id="ronde_id" type="number" placeholder="Geef een Ronde ID" />
        <input id="toernooi_id" type="number" placeholder="Geef een Toernooi ID" />
        <input id="ronde_nummer" type="number" placeholder="Geef een Ronde Nummer" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>

     <section aria-labelledby="Delete-Rondes-title">
      <h2 id="Delete-Rondes-title">Verwijder een Rondes</h2>
      <div class="Delete-Rondes">
        <button id="delete-ronde">verwijder ronde</button>
        <input id="delete-ronde_id" type="number" placeholder="Geef een Ronde ID" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>

     <section aria-labelledby="Put-Rondes-title">
      <h2 id="Put-Rondes-title">Update een Rondes</h2>
      <div class="Put-Rondes">
        <button id="update-ronde">update ronde</button>
        <input id="update-ronde_id" type="number" placeholder="Geef een Ronde ID" />
        <input id="update-toernooi_id" type="number" placeholder="Geef een Toernooi ID" />
        <input id="update-ronde_nummer" type="number" placeholder="Geef een Ronde Nummer" />
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <div id="results" class="grid" aria-live="polite"></div>
    </section>
    <script>
      window.alleRondes = [];
      document.addEventListener("DOMContentLoaded", function() {
        function toonRondeKaart(r, results) {
          const div = document.createElement("div");
          div.className = "Get-Rondes";
          div.innerHTML = "<h3>ID: " + (r.rondeId ?? "—") + "</h3>"
            + "<p>ToernooiID: " + (r.toernooiId ?? "—") + "</p>"
            + "<p>RondeNummer: " + (r.rondeNummer ?? "—") + "</p>";
          results.appendChild(div);
        }
        function zoekOpId() {
          const id = document.getElementById("search-id").value.trim();
          if (!id) { alert("Geef een ronde ID op."); return; }
          const status = document.getElementById("status");
          const results = document.getElementById("results");
          if (window.alleRondes.length > 0) {
            const gevonden = window.alleRondes.filter(r => String(r.rondeId) === id);
            if (gevonden.length > 0) {
              status.textContent = ""; results.innerHTML = "";
              gevonden.forEach(r => toonRondeKaart(r, results)); return;
            }
          }
          status.textContent = "Laden…";
          fetch("http://localhost:5080/api/Ronde/" + id)
            .then(r => { if (!r.ok) throw new Error("Ronde niet gevonden"); return r.json(); })
            .then(data => {
              status.textContent = ""; results.innerHTML = "";
              const lijst = Array.isArray(data) ? data : [data];
              lijst.forEach(r => toonRondeKaart(r, results));
            })
            .catch(err => { status.textContent = err.message; });
        }
        document.getElementById("search-ronde-id").addEventListener("click", zoekOpId);
        document.getElementById("search-id").addEventListener("keydown", function(e) { if (e.key === "Enter") zoekOpId(); });
      });
    </script>
    <script src="ronde.js"></script>
    <link rel="stylesheet" href="styles.css" />
    
    </main>
</body>
</html>
